<head>

  <!-- Tailwind v4 (browser build — em produção, usar o build via PostCSS/Vite) -->

  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));

    @theme {
      --color-petrol-700: #15526B;
      --color-petrol-800: #0F3D4E;
      --color-petrol-900: #0B2D3C;
      --color-petrol-950: #071E2C;
      --color-laranja: #C47A3A;
      --color-laranja-escuro: #A05E28;
      --color-areia: #F5F0E8;
      --color-neutral-925: #111111;
      --font-sans: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
      --font-display: 'Plus Jakarta Sans', ui-sans-serif, sans-serif;
    }

    .nav-item {
      @apply flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition;
    }
    .nav-item-ativo {
      @apply relative bg-white/10 text-white;
    }
    .nav-item-ativo::before {
      content: '';
      @apply absolute left-0 top-1/2 -translate-y-1/2 h-5 w-1 rounded-r bg-laranja;
    }
    .cartao { @apply bg-white dark:bg-neutral-950 rounded-xl border border-slate-200 dark:border-neutral-800 shadow-sm; }
    .titulo-secao { @apply font-display font-semibold text-slate-900 dark:text-neutral-100; }
    .rotulo { @apply text-[11px] font-semibold uppercase tracking-wider text-slate-500 dark:text-neutral-400; }
    .link { @apply text-sm font-medium text-petrol-800 dark:text-sky-300 hover:underline; }

    .botao-pri { @apply inline-flex items-center gap-1.5 rounded-lg bg-petrol-800 dark:bg-sky-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-petrol-900 dark:hover:bg-sky-500 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-petrol-800/40 disabled:opacity-50 disabled:cursor-not-allowed; }
    .botao-sec { @apply inline-flex items-center gap-1.5 rounded-lg border border-slate-200 dark:border-neutral-800 bg-white dark:bg-neutral-950 px-3 py-1.5 text-sm font-medium text-slate-700 dark:text-neutral-200 hover:bg-slate-50 dark:hover:bg-neutral-900 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-petrol-800/40 disabled:opacity-50 disabled:cursor-not-allowed; }
    .botao-perigo { @apply inline-flex items-center gap-1.5 rounded-lg bg-red-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-red-700 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-red-600/40 disabled:opacity-50 disabled:cursor-not-allowed; }
    .campo { @apply w-full rounded-lg border border-slate-200 dark:border-neutral-800 bg-white dark:bg-neutral-950 px-3 py-1.5 text-sm text-slate-800 dark:text-neutral-100 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-petrol-800/30 dark:focus:ring-sky-500/40 focus:border-petrol-800 dark:focus:border-sky-500 disabled:opacity-60 disabled:cursor-not-allowed; }
    .zebra tbody tr:nth-child(even) { @apply bg-slate-50/70 dark:bg-neutral-900/40; }
    .zebra tbody td { @apply px-4 py-2.5 align-middle; }
    /* A linha inteira acende no mouse e no foco por teclado (barra laranja + fundo), para o
       professor não errar de aluno na chamada. `table.zebra` vence a zebra nos dois temas. */
    table.zebra tbody tr { @apply transition-colors; }
    table.zebra tbody tr:hover,
    table.zebra tbody tr:focus-within { @apply bg-laranja/15 dark:bg-laranja/20; }
    table.zebra tbody td:first-child { @apply relative; }
    table.zebra tbody tr:hover td:first-child::before,
    table.zebra tbody tr:focus-within td:first-child::before { content: ''; @apply absolute inset-y-0 left-0 w-1 rounded-r bg-laranja; }
    @media (prefers-reduced-motion: reduce) { table.zebra tbody tr { transition: none; } }
    .seg { @apply inline-flex rounded-lg border border-slate-200 dark:border-neutral-800 overflow-hidden; }
    .seg button { @apply px-2.5 py-1 text-xs font-medium text-slate-600 dark:text-neutral-300 bg-white dark:bg-neutral-950 hover:bg-slate-50 dark:hover:bg-neutral-900 transition border-l border-slate-200 dark:border-neutral-800 first:border-l-0 focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-petrol-800/40 disabled:opacity-50 disabled:cursor-not-allowed; }
    .seg button[aria-checked="true"] { @apply text-white; }
    .seg button[aria-checked="true"][data-status="presente"] { @apply bg-emerald-600 hover:bg-emerald-600; }
    .seg button[aria-checked="true"][data-status="atraso"] { @apply bg-amber-500 hover:bg-amber-500; }
    .seg button[aria-checked="true"][data-status="justificada"] { @apply bg-sky-600 hover:bg-sky-600; }
    .seg button[aria-checked="true"][data-status="ausente"] { @apply bg-red-600 hover:bg-red-600; }
    .aba { @apply px-1 pb-2.5 -mb-px text-sm border-b-2 border-transparent text-slate-500 dark:text-neutral-400 hover:text-slate-800 dark:hover:text-neutral-200 transition whitespace-nowrap; }
    .aba-ativa { @apply border-[color:var(--f-marca-tinta)] text-slate-900 dark:text-neutral-100 font-medium; }
    .modal-anim { animation: surgir 0.2s ease both; }
    .surgir { animation: surgir 0.35s ease both; }
    @keyframes surgir { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .surgir { animation: none; } }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body data-modo="detalhe" class="h-full bg-areia dark:bg-black font-sans text-slate-800 dark:text-neutral-100 antialiased">
  <div class="flex h-screen overflow-hidden">

    <!-- Sidebar do portal do professor (copiar em toda tela do portal). -->

      <div class="h-14 flex items-center gap-3 px-5 border-b border-white/10">
        <img src="img/aulor-simbolo.svg" alt="" class="h-10 w-10 shrink-0">
        <div class="leading-tight">

          <p class="text-[11px] text-slate-400 mt-1">Portal do Professor</p>
        </div>
      </div>

      <nav class="flex-1 py-4 px-3 space-y-1 text-sm overflow-y-auto" style="visibility:hidden">

          Minhas turmas
        </a>
        <p data-privado class="px-3 pt-5 pb-1 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Alunos</p>
        <a data-privado href="avaliacoes.html" class="nav-item">
          <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" /></svg>
          Avaliações
        </a>
        <p data-privado class="px-3 pt-5 pb-1 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Financeiro</p>
        <a data-privado href="pagamentos.html" class="nav-item">
          <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5z" /></svg>
          Pagamentos
        </a>
        <a data-privado href="contratos.html" class="nav-item">
          <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" /></svg>

        </a>
        <p data-privado class="px-3 pt-5 pb-1 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Conta</p>

      <div class="px-5 py-4 border-t border-white/10 text-[11px] text-slate-500">Protótipo · v0.1 · Professor · <a href="../inicio.html" class="underline hover:text-slate-300">Trocar de portal</a></div>
    </aside>

    <!-- Área principal -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <header class="relative z-30 h-14 shrink-0 bg-petrol-950 dark:bg-petrol-900 border-b border-white/10 px-4 md:px-6 flex items-center justify-between gap-4">
        <div class="flex items-center gap-2 min-w-0">
          <button type="button" data-toggle-sidebar title="Ocultar menu"
            class="-ml-1 p-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-white/40">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
          </button>
          <h1 class="font-display font-semibold text-white">Aulas</h1>
        </div>
        <div class="flex items-center gap-3">
          <button type="button" data-toggle-tema title="Tema escuro"
            class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-white/40">
            <svg class="h-5 w-5 dark:hidden" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" /></svg>
            <svg class="h-5 w-5 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" /></svg>
          </button>
          <div class="relative pl-3 border-l border-white/15">
            <button type="button" id="menu-usuario" aria-haspopup="menu" aria-expanded="false"
              class="flex items-center gap-2.5 rounded-lg p-1 pr-2 hover:bg-white/10 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-white/40">
              <div id="avatar" class="h-8 w-8 rounded-full bg-petrol-700 text-white grid place-items-center text-xs font-semibold overflow-hidden"></div>
              <div class="leading-tight hidden sm:block text-left">
                <p id="nome-usuario" class="text-sm font-medium text-white"></p>
                <p class="text-[11px] text-slate-400">Professor</p>
              </div>
              <svg class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>
            </button>
            <div id="menu-usuario-lista" role="menu" class="hidden absolute right-0 mt-1 w-48 cartao py-1 modal-anim">
              <button type="button" id="sair" role="menuitem" class="w-full text-left px-4 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-slate-50 dark:hover:bg-neutral-900">Sair</button>
            </div>
          </div>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
        <nav id="breadcrumb" aria-label="Breadcrumb" class="surgir flex items-center gap-1.5 text-sm text-slate-500 dark:text-neutral-400"></nav>

        <section id="cabecalho" class="surgir" style="animation-delay: 60ms"></section>

        <div class="surgir" style="animation-delay: 120ms">
          <nav id="abas" class="flex items-center gap-6 border-b border-slate-200 dark:border-neutral-800 overflow-x-auto" aria-label="Abas da aula">
            <button type="button" data-aba="chamada" class="aba">Chamada</button>
            <button type="button" data-aba="diario" class="aba">Diário</button>
            <button type="button" data-privado data-aba="avaliacao" class="aba">Avaliação do dia <span id="aba-avaliacao-badge" class="hidden ml-1 rounded-full px-1.5 text-[11px] tabular-nums bg-slate-100 dark:bg-neutral-900 text-slate-500 dark:text-neutral-400"></span></button>
          </nav>
          <section id="aba-chamada" class="hidden pt-5 space-y-4"></section>
          <section id="aba-diario" class="hidden pt-5 space-y-4"></section>
          <section id="aba-avaliacao" data-privado class="hidden pt-5 space-y-4"></section>
        </div>
      </main>
    </div>
  </div>


  <!-- Modal de confirmação (ações em massa / destrutivas) -->
  <div id="modal" class="hidden fixed inset-0 z-40 grid place-items-center bg-slate-900/50 dark:bg-black/70 p-4" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="cartao w-full max-w-md p-5 modal-anim">
      <h3 id="modal-titulo" class="font-display font-semibold text-lg text-slate-900 dark:text-neutral-100"></h3>
      <div id="modal-texto" class="text-sm text-slate-600 dark:text-neutral-300 mt-2"></div>
      <div class="mt-5 flex justify-end gap-2">
        <button type="button" id="modal-cancelar" class="botao-sec">Cancelar</button>
        <button type="button" id="modal-confirmar" class="botao-perigo"></button>
      </div>
    </div>
  </div>

  <div id="toasts" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center pointer-events-none"></div>

</body>
