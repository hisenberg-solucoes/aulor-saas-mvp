<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aulor · Curso</title>
  <!-- Tailwind v4 (browser build — em produção, usar o build via PostCSS/Vite) -->
  <script src="js/tema.js"></script>
  <script src="js/tooltip.js" defer></script>
  <script src="js/menu.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));

    @theme {
      --color-petrol-700: #15526B;
      --color-petrol-800: #0F3D4E;
      --color-petrol-900: #0B2D3C;
      --color-petrol-950: #071E2C;
      --color-laranja: #C47A3A;
      --color-laranja-escuro: #A05E28;
      --color-areia: #F5F0E8;
      --color-fundo: #F3F5F6; /* petróleo a 5% sobre branco: neutro frio da paleta */
      --color-neutral-925: #111111;
      --font-sans: 'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, sans-serif;
      --font-display: 'Atkinson Hyperlegible Next', ui-sans-serif, sans-serif;
      --font-registro: 'Source Serif 4', Georgia, serif;
    }


    .campo {
      @apply w-full rounded-lg border border-slate-300 dark:border-neutral-700 bg-white dark:bg-neutral-950 px-3 py-2 text-sm text-slate-700 dark:text-neutral-200 placeholder:text-slate-400 focus:outline-none focus:border-petrol-800 dark:focus:border-sky-400 focus:ring-2 focus:ring-petrol-800/20 disabled:opacity-60;
    }

    .campo-erro {
      @apply border-red-500 dark:border-red-500 focus:border-red-500 focus:ring-red-500/20;
    }

    .check {
      @apply appearance-none shrink-0 h-[18px] w-[18px] rounded-[5px] border-2 border-slate-300 dark:border-neutral-600 bg-white dark:bg-neutral-950 cursor-pointer transition
        hover:border-petrol-800 dark:hover:border-sky-400
        focus:outline-none focus-visible:ring-2 focus-visible:ring-petrol-800/30 dark:focus-visible:ring-sky-400/40
        checked:border-petrol-800 checked:bg-petrol-800 dark:checked:border-sky-400 dark:checked:bg-sky-400
        disabled:opacity-50 disabled:cursor-not-allowed
        bg-center bg-no-repeat;
    }

    .check:checked {
      background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='none' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M3.5 8.5l3 3 6-6.5' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3e%3c/svg%3e");
      background-size: 14px 14px;
    }

    .dark .check:checked {
      background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='none' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M3.5 8.5l3 3 6-6.5' stroke='%23000' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3e%3c/svg%3e");
    }

    .rotulo {
      @apply block text-xs font-medium text-slate-500 dark:text-neutral-400 mb-1;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="img/aulor-favicon.svg">
</head>
<body data-modo="detalhe" class="h-full bg-fundo dark:bg-black font-sans text-slate-800 dark:text-neutral-100 antialiased">
  <div class="flex h-screen overflow-hidden">

    <aside data-sidebar class="shell shell-lateral">
      <div class="shell-marca">
        <img src="img/aulor-simbolo.svg" alt="" class="shell-simbolo">
        <div>
          <img src="img/aulor-wordmark-claro.svg" alt="Aulor" class="shell-wordmark">
        </div>
      </div>
      <nav class="shell-nav" aria-label="Menu principal"></nav>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden">
      <header class="shell shell-topo">
        <div class="shell-contexto">
          <button type="button" data-toggle-sidebar title="Ocultar menu" class="shell-icone">
            <svg aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
          </button>
          <h1 class="shell-titulo">Cursos</h1>
        </div>
        <div class="shell-acoes">
          <button type="button" data-toggle-tema title="Tema escuro" class="shell-icone">
            <svg class="shell-tema-lua" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" /></svg>
            <svg class="shell-tema-sol" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" /></svg>
          </button>
          <a href="conta.html" class="shell-usuario" data-tip="Minha conta">
            <span class="shell-avatar" aria-hidden="true">AS</span>
            <span>
              <span class="shell-usuario-nome">Ana Souza</span>
              <span class="shell-usuario-papel">Administradora</span>
            </span>
          </a>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto p-4 md:p-6">
        <div id="tela"></div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="fixed bottom-5 right-5 z-50 space-y-2"></div>

  <script src="js/agenda.js"></script>
  <script src="js/softwares-data.js"></script>
  <script src="js/cursos-data.js"></script>
  <script src="js/cursos-motor.js"></script>
  <script src="js/avaliacoes-ui.js"></script>
  <script src="js/documento.js"></script>
  <script src="js/ui-form.js"></script>
  <script src="js/areas-data.js"></script>
  <script src="js/areas-motor.js"></script>
  <script src="js/templates-certificado-data.js"></script>
  <script src="js/templates-certificado-motor.js"></script>
  <script src="js/menu-mais.js"></script>
  <script src="js/cursos-app.js"></script>
</body>
</html>
