<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aulor · Portal do Aluno · Meus dados</title>
  <!-- Tailwind v4 (browser build — em produção, usar o build via PostCSS/Vite) -->
  <script src="../js/tema.js"></script>
  <script src="../js/tooltip.js" defer></script>
  <script src="js/menu.js" defer></script>
  <script src="../js/menu-portal.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));

    @theme {
      --color-petrol-700: #15526B;
      --color-petrol-800: #0F3D4E;
      --color-petrol-900: #0B2D3C;
      --color-petrol-950: #071E2C;
      --color-areia: #F5F0E8;
      --color-fundo: #F3F5F6; /* petróleo a 5% sobre branco: neutro frio da paleta */
      --color-neutral-925: #111111;
      --font-sans: 'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, sans-serif;
      --font-display: 'Atkinson Hyperlegible Next', ui-sans-serif, sans-serif;
    }

    .cartao { @apply bg-white dark:bg-neutral-950 rounded-xl border border-slate-200/80 dark:border-neutral-800 shadow-[0_1px_2px_rgb(7_30_44/0.05)] dark:shadow-none; }
    .titulo-secao { @apply font-display font-semibold text-slate-900 dark:text-neutral-100; }
    .rotulo { @apply text-xs font-medium text-slate-500 dark:text-neutral-400; }
    .link { @apply text-sm font-medium text-petrol-800 dark:text-sky-300 hover:underline; }
    .tabela th { @apply px-4 py-2.5 text-left text-xs font-medium text-slate-500 dark:text-neutral-400; }
    .tabela td { @apply px-4 py-2.5 text-sm text-slate-700 dark:text-neutral-200 align-middle; }
    .tabela tbody tr { @apply border-t border-slate-200 dark:border-neutral-800; }
    .botao-sec { @apply inline-flex items-center gap-1.5 h-9 px-3 rounded-lg text-sm font-medium border border-slate-300 dark:border-neutral-700 bg-white dark:bg-neutral-950 text-slate-600 dark:text-neutral-300 hover:border-petrol-800 dark:hover:border-sky-400 hover:text-petrol-800 dark:hover:text-sky-300 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-petrol-800/30 disabled:opacity-40 disabled:pointer-events-none; }
    .botao-pri { @apply inline-flex items-center gap-1.5 h-9 px-3.5 rounded-lg text-sm font-semibold bg-petrol-800 hover:bg-petrol-900 dark:bg-areia dark:hover:bg-white dark:text-petrol-800 text-white shadow-sm transition focus:outline-none focus-visible:ring-2 focus-visible:ring-petrol-800/40 disabled:opacity-40 disabled:pointer-events-none; }
    .select { @apply rounded-lg border border-slate-300 dark:border-neutral-700 bg-white dark:bg-neutral-950 px-3 py-1.5 text-sm text-slate-700 dark:text-neutral-200 focus:outline-none focus:border-petrol-800 dark:focus:border-sky-400 focus:ring-2 focus:ring-petrol-800/20; }
    .campo { @apply w-full rounded-lg border border-slate-300 dark:border-neutral-700 bg-white dark:bg-neutral-950 px-3 py-2 text-sm text-slate-800 dark:text-neutral-100 placeholder:text-slate-400 focus:outline-none focus:border-petrol-800 dark:focus:border-sky-400 focus:ring-2 focus:ring-petrol-800/20; }
    .campo-erro { @apply border-red-500 dark:border-red-400 focus:border-red-500 dark:focus:border-red-400 focus:ring-red-500/20; }
    .cartao-radio { @apply flex items-start gap-3 rounded-lg border border-slate-200 dark:border-neutral-800 p-3 cursor-pointer transition hover:border-petrol-800 dark:hover:border-sky-400 has-[:checked]:border-petrol-800 dark:has-[:checked]:border-sky-400 has-[:checked]:bg-petrol-800/5 dark:has-[:checked]:bg-sky-400/10; }
    .surgir { animation: surgir 0.35s ease both; }
    @keyframes surgir { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .surgir { animation: none; } }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="icon" type="image/svg+xml" href="../img/aulor-favicon.svg">
</head>
<body class="h-full bg-fundo dark:bg-black font-sans text-slate-800 dark:text-neutral-100 antialiased">
  <div class="flex h-screen overflow-hidden">

    <!-- Sidebar: shell comum dos portais; os itens em js/menu.js, o desenho em ../js/menu-portal.js. -->
    <aside data-sidebar class="shell shell-lateral">
      <div class="shell-marca">
        <img src="../img/aulor-simbolo.svg" alt="" class="shell-simbolo">
        <div>
          <img src="../img/aulor-wordmark-claro.svg" alt="Aulor" class="shell-wordmark">
        </div>
      </div>
      <nav class="shell-nav" aria-label="Menu principal"></nav>
    </aside>

    <!-- Área principal -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <header class="shell shell-topo">
        <div class="shell-contexto">
          <button type="button" data-toggle-sidebar title="Ocultar menu" class="shell-icone">
            <svg aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
          </button>
          <h1 class="shell-titulo">Conta</h1>
        </div>
        <div class="shell-acoes">
          <button type="button" data-toggle-tema title="Tema escuro" class="shell-icone">
            <svg class="shell-tema-lua" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" /></svg>
            <svg class="shell-tema-sol" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" /></svg>
          </button>
          <span class="shell-usuario"></span>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto p-6 space-y-6">
        <!-- Cabeçalho: avatar de iniciais, nome, e-mail e situação do cadastro -->
        <div class="surgir cartao p-5 flex flex-wrap items-center justify-between gap-4">
          <div class="flex items-center gap-4 min-w-0">
            <div id="avatar-grande" class="h-16 w-16 shrink-0 rounded-full bg-petrol-800 dark:bg-sky-600 text-white grid place-items-center text-xl font-display font-semibold overflow-hidden"></div>
            <div class="min-w-0">
              <h2 id="cab-nome" class="font-display text-xl font-semibold text-slate-900 dark:text-neutral-100 truncate"></h2>
              <p id="cab-email" class="text-sm text-slate-500 dark:text-neutral-400 truncate"></p>
              <p id="cab-situacao" class="text-sm mt-1"></p>
            </div>
          </div>
          <div id="cab-acoes" class="flex items-center gap-2"></div>
        </div>

        <!-- Abas: Dados pessoais · Contato e endereço · Necessidades · Responsáveis · Acesso · Privacidade -->
        <div class="surgir" style="animation-delay: 60ms">
          <nav id="abas" class="flex items-center gap-6 border-b border-slate-200 dark:border-neutral-800 overflow-x-auto"></nav>
          <section id="conteudo-aba" class="pt-5"></section>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal centralizado (edição de contato/endereço/necessidades, senha, confirmações) -->
  <div id="modal" class="hidden fixed inset-0 z-40 bg-black/50 dark:bg-black/70 p-4 grid place-items-center">
    <div id="modal-caixa" role="dialog" aria-modal="true" class="cartao modal-anim w-full max-w-2xl max-h-[90vh] overflow-y-auto"></div>
  </div>

  <div id="toasts" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 items-end pointer-events-none" role="status" aria-live="polite"></div>

  <script src="../js/agenda.js"></script>
  <script src="../js/cursos-data.js"></script>
  <script src="../js/cursos-motor.js"></script>
  <script src="../js/salas-data.js"></script>
  <script src="../js/salas-motor.js"></script>
  <script src="../js/formacoes-data.js"></script>
  <script src="../js/formacoes-motor.js"></script>
  <script src="../js/clientes-data.js"></script>
  <script src="../js/clientes-motor.js"></script>
  <script src="../js/contratos-data.js"></script>
  <script src="../js/contratos-motor.js"></script>
  <script src="../js/feriados-data.js"></script>
  <script src="../js/feriados-motor.js"></script>
  <script src="../js/aulas-motor.js"></script>
  <script src="../js/turmas-motor.js"></script>
  <script src="../js/instrutores-data.js"></script>
  <script src="../js/instrutores-motor.js"></script>
  <script src="js/portal-aluno-motor.js"></script>
  <script src="js/meus-dados-app.js"></script>
</body>
</html>
