<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aulor · Portal do Aluno · Início</title>
  <!-- Tailwind v4 (browser build — em produção, usar o build via PostCSS/Vite) -->
  <script src="../js/tema.js"></script>
  <script src="../js/tooltip.js" defer></script>
  <script src="js/menu.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));

    @theme {
      --color-petrol-700: #15526B;
      --color-petrol-800: #0F3D4E;
      --color-petrol-900: #0B2D3C;
      --color-petrol-950: #071E2C;
      --color-laranja: #C47A3A;
      --color-laranja-escuro: #A05E28;
      --color-areia: #F5F0E8;
      --color-neutral-925: #111111;
      --font-sans: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
      --font-display: 'Plus Jakarta Sans', ui-sans-serif, sans-serif;
    }

    .nav-item {
      @apply flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition;
    }
    .nav-item-ativo {
      @apply relative bg-white/10 text-white;
    }
    .nav-item-ativo::before {
      content: '';
      @apply absolute left-0 top-1/2 -translate-y-1/2 h-5 w-1 rounded-r bg-laranja;
    }
    .cartao { @apply bg-white dark:bg-neutral-950 rounded-xl border border-slate-200 dark:border-neutral-800 shadow-sm; }
    .titulo-secao { @apply font-display font-semibold text-slate-900 dark:text-neutral-100; }
    .rotulo { @apply text-[11px] font-semibold uppercase tracking-wider text-slate-500 dark:text-neutral-400; }
    .link { @apply text-sm font-medium text-petrol-800 dark:text-sky-300 hover:underline; }
    .surgir { animation: surgir 0.35s ease both; }
    @keyframes surgir { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .surgir { animation: none; } }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="icon" type="image/svg+xml" href="../img/aulor-favicon.svg">
</head>
<body class="h-full bg-areia dark:bg-black font-sans text-slate-800 dark:text-neutral-100 antialiased">
  <div class="flex h-screen overflow-hidden">

    <!-- Sidebar do portal do aluno: só Início existe; os demais itens são o mapa das próximas telas. -->
    <aside data-sidebar class="hidden md:flex w-60 shrink-0 bg-petrol-950 dark:bg-petrol-900 text-slate-300 flex-col dark:border-r dark:border-white/10">
      <div class="h-14 flex items-center gap-3 px-5 border-b border-white/10">
        <img src="../img/aulor-simbolo.svg" alt="" class="h-10 w-10 shrink-0">
        <div class="leading-tight">
          <img src="../img/aulor-wordmark-claro.svg" alt="Aulor" class="h-4 w-auto">
          <p class="text-[11px] text-slate-400 mt-1">Portal do Aluno</p>
        </div>
      </div>

      <nav class="flex-1 py-4 px-3 space-y-1 text-sm overflow-y-auto" style="visibility:hidden">
        <a href="home.html" class="nav-item nav-item-ativo" aria-current="page">

          Início
        </a>
        <p class="px-3 pt-5 pb-1 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Estudos</p>
        <a href="cursos.html" class="nav-item">
          <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.55 50.55 0 0112 13.489a50.702 50.702 0 017.74-3.342M6.75 15a.75.75 0 100-1.5.75.75 0 000 1.5zm0 0v-3.675A55.378 55.378 0 0112 8.443m-7.007 11.55A5.981 5.981 0 006.75 15.75v-1.5" /></svg>
          Meus cursos
        </a>
        <a href="aulas.html" class="nav-item">
          <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" /></svg>
          Aulas
        </a>
        <a href="calendario.html" class="nav-item">
          <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5M8.25 12.75h.008v.008H8.25v-.008zm3.75 0h.008v.008H12v-.008zm3.75 0h.008v.008h-.008v-.008zM8.25 16.5h.008v.008H8.25V16.5zm3.75 0h.008v.008H12V16.5z" /></svg>
          Calendário
        </a>
        <a href="materiais.html" class="nav-item">
          <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" /></svg>
          Materiais
        </a>
        <p class="px-3 pt-5 pb-1 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Secretaria</p>
        <a href="financeiro.html" class="nav-item">
          <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5z" /></svg>
          Financeiro
        </a>
        <a href="contratos.html" class="nav-item">
          <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" /></svg>
          Contratos
        </a>
        <p class="px-3 pt-5 pb-1 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Conta</p>
        <a href="meus-dados.html" id="link-cadastro" class="nav-item">
          <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg>
          Meus dados

      <div class="px-5 py-4 border-t border-white/10 text-[11px] text-slate-500">Protótipo · v0.1 · Aluno · <a href="../inicio.html" class="underline hover:text-slate-300">Trocar de portal</a></div>
    </aside>

    <!-- Área principal -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <header class="h-14 shrink-0 bg-petrol-950 dark:bg-petrol-900 border-b border-white/10 px-4 md:px-6 flex items-center justify-between gap-4">
        <div class="flex items-center gap-2 min-w-0">
          <button type="button" data-toggle-sidebar title="Ocultar menu"
            class="-ml-1 p-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-white/40">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
          </button>
          <h1 class="font-display font-semibold text-white">Início</h1>
        </div>
        <div class="flex items-center gap-3">
          <button type="button" data-toggle-tema title="Tema escuro"
            class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-white/40">
            <svg class="h-5 w-5 dark:hidden" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" /></svg>
            <svg class="h-5 w-5 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" /></svg>
          </button>
          <div class="relative pl-3 border-l border-white/15">
            <button type="button" id="menu-usuario" aria-haspopup="menu" aria-expanded="false"
              class="flex items-center gap-2.5 rounded-lg p-1 pr-2 hover:bg-white/10 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-white/40">
              <div id="avatar" class="h-8 w-8 rounded-full bg-petrol-700 text-white grid place-items-center text-xs font-semibold overflow-hidden"></div>
              <div class="leading-tight hidden sm:block text-left">
                <p id="nome-usuario" class="text-sm font-medium text-white"></p>
                <p class="text-[11px] text-slate-400">Aluno</p>
              </div>
              <svg class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>
            </button>
            <div id="menu-usuario-lista" role="menu" class="hidden absolute right-0 mt-1 w-48 cartao py-1 modal-anim">
              <button type="button" id="sair" role="menuitem" class="w-full text-left px-4 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-slate-50 dark:hover:bg-neutral-900">Sair</button>
            </div>
          </div>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
        <div class="surgir">
          <h2 id="saudacao" class="font-display text-xl font-semibold text-slate-900 dark:text-neutral-100"></h2>
          <p id="data-hoje" class="text-sm text-slate-500 dark:text-neutral-400 mt-0.5"></p>
        </div>

        <!-- Sala da turma no Google Meet (só quando a turma tem link) -->
        <section id="sala-meet" class="hidden surgir" style="animation-delay: 40ms"></section>

        <!-- Destaques: próxima aula, financeiro -->
        <section id="destaques" class="grid grid-cols-1 md:grid-cols-2 gap-4 surgir" style="animation-delay: 60ms"></section>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 surgir" style="animation-delay: 120ms">
          <!-- Meus cursos -->
          <section class="xl:col-span-2">
            <div class="flex items-center justify-between gap-3 mb-3">
              <h2 class="titulo-secao">Meus cursos</h2>
              <p class="text-sm text-slate-500 dark:text-neutral-400"><span id="cursos-resumo"></span> <a href="cursos.html" class="link ml-2">Ver todos</a></p>
            </div>
            <div id="cursos" class="space-y-4"></div>
          </section>
          <div class="space-y-6">
            <section>
              <h2 class="titulo-secao mb-3">Próximas aulas</h2>
              <div id="proximas-aulas" class="cartao divide-y divide-slate-100 dark:divide-neutral-900"></div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toasts" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center pointer-events-none"></div>

  <script src="../js/agenda.js"></script>
  <script src="../js/cursos-data.js"></script>
  <script src="../js/cursos-motor.js"></script>
  <script src="../js/salas-data.js"></script>
  <script src="../js/salas-motor.js"></script>
  <script src="../js/formacoes-data.js"></script>
  <script src="../js/formacoes-motor.js"></script>
  <script src="../js/clientes-data.js"></script>
  <script src="../js/clientes-motor.js"></script>
  <script src="../js/contratos-data.js"></script>
  <script src="../js/contratos-motor.js"></script>
  <script src="../js/feriados-data.js"></script>
  <script src="../js/feriados-motor.js"></script>
  <script src="../js/aulas-motor.js"></script>
  <script src="../js/turmas-motor.js"></script>
  <script src="../js/instrutores-data.js"></script>
  <script src="../js/instrutores-motor.js"></script>
  <script src="js/portal-aluno-motor.js"></script>
  <script src="js/home-app.js"></script>
</body>
</html>
