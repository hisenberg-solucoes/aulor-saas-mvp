<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aulor · Portal do Aluno · Início</title>
  <!-- Tailwind v4 (browser build — em produção, usar o build via PostCSS/Vite) -->
  <script src="../js/tema.js"></script>
  <script src="../js/tooltip.js" defer></script>
  <script src="js/menu.js" defer></script>
  <script src="../js/menu-portal.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));

    @theme {
      --color-petrol-700: #15526B;
      --color-petrol-800: #0F3D4E;
      --color-petrol-900: #0B2D3C;
      --color-petrol-950: #071E2C;
      --color-areia: #F5F0E8;
      --color-fundo: #F3F5F6; /* petróleo a 5% sobre branco: neutro frio da paleta */
      --color-neutral-925: #111111;
      --font-sans: 'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, sans-serif;
      --font-display: 'Atkinson Hyperlegible Next', ui-sans-serif, sans-serif;
    }

    .cartao { @apply bg-white dark:bg-neutral-950 rounded-xl border border-slate-200/80 dark:border-neutral-800 shadow-[0_1px_2px_rgb(7_30_44/0.05)] dark:shadow-none; }
    .titulo-secao { @apply font-display font-semibold text-slate-900 dark:text-neutral-100; }
    .rotulo { @apply text-xs font-medium text-slate-500 dark:text-neutral-400; }
    .link { @apply text-sm font-medium text-petrol-800 dark:text-sky-300 hover:underline; }
    .surgir { animation: surgir 0.35s ease both; }
    @keyframes surgir { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .surgir { animation: none; } }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="icon" type="image/svg+xml" href="../img/aulor-favicon.svg">
</head>
<body class="h-full bg-fundo dark:bg-black font-sans text-slate-800 dark:text-neutral-100 antialiased">
  <div class="flex h-screen overflow-hidden">

    <!-- Sidebar: shell comum dos portais; os itens em js/menu.js, o desenho em ../js/menu-portal.js. -->
    <aside data-sidebar class="shell shell-lateral">
      <div class="shell-marca">
        <img src="../img/aulor-simbolo.svg" alt="" class="shell-simbolo">
        <div>
          <img src="../img/aulor-wordmark-claro.svg" alt="Aulor" class="shell-wordmark">
        </div>
      </div>
      <nav class="shell-nav" aria-label="Menu principal"></nav>
    </aside>

    <!-- Área principal -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <header class="shell shell-topo">
        <div class="shell-contexto">
          <button type="button" data-toggle-sidebar title="Ocultar menu" class="shell-icone">
            <svg aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
          </button>
          <h1 class="shell-titulo">Início</h1>
        </div>
        <div class="shell-acoes">
          <button type="button" data-toggle-tema title="Tema escuro" class="shell-icone">
            <svg class="shell-tema-lua" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" /></svg>
            <svg class="shell-tema-sol" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" /></svg>
          </button>
          <span class="shell-usuario"></span>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto p-6 space-y-6">
        <div class="surgir">
          <h2 id="saudacao" class="font-display text-xl font-semibold text-slate-900 dark:text-neutral-100"></h2>
          <p id="data-hoje" class="text-sm text-slate-500 dark:text-neutral-400 mt-0.5"></p>
        </div>

        <!-- Pendências: contrato a assinar, parcela vencida, material novo (só quando há alguma) -->
        <section id="pendencias" class="hidden surgir" style="animation-delay: 40ms"></section>

        <!-- Destaques: próxima aula, financeiro -->
        <section id="destaques" class="grid grid-cols-1 md:grid-cols-2 gap-4 surgir" style="animation-delay: 60ms"></section>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 surgir" style="animation-delay: 120ms">
          <!-- Meus cursos -->
          <section class="xl:col-span-2">
            <div class="flex items-center justify-between gap-3 mb-3">
              <h2 class="titulo-secao">Meus cursos</h2>
              <p class="text-sm text-slate-500 dark:text-neutral-400"><span id="cursos-resumo"></span> <a href="cursos.html" class="link ml-2">Ver todos</a></p>
            </div>
            <div id="cursos" class="space-y-4"></div>
          </section>
          <div class="space-y-6">
            <section>
              <h2 class="titulo-secao mb-3">Próximas aulas</h2>
              <div id="proximas-aulas" class="cartao divide-y divide-slate-100 dark:divide-neutral-900"></div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/agenda.js"></script>
  <script src="../js/cursos-data.js"></script>
  <script src="../js/cursos-motor.js"></script>
  <script src="../js/salas-data.js"></script>
  <script src="../js/salas-motor.js"></script>
  <script src="../js/formacoes-data.js"></script>
  <script src="../js/formacoes-motor.js"></script>
  <script src="../js/clientes-data.js"></script>
  <script src="../js/clientes-motor.js"></script>
  <script src="../js/contratos-data.js"></script>
  <script src="../js/contratos-motor.js"></script>
  <script src="../js/feriados-data.js"></script>
  <script src="../js/feriados-motor.js"></script>
  <script src="../js/aulas-motor.js"></script>
  <script src="../js/turmas-motor.js"></script>
  <script src="../js/instrutores-data.js"></script>
  <script src="../js/instrutores-motor.js"></script>
  <script src="../js/materiais-motor.js"></script>
  <script src="js/portal-aluno-motor.js"></script>
  <script src="js/home-app.js"></script>
</body>
</html>
