<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aulor · Portal do Aluno · Calendário</title>
  <!-- Tailwind v4 (browser build — em produção, usar o build via PostCSS/Vite) -->
  <script src="../js/tema.js"></script>
  <script src="../js/tooltip.js" defer></script>
  <script src="js/menu.js" defer></script>
  <script src="../js/menu-portal.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));

    @theme {
      --color-petrol-700: #15526B;
      --color-petrol-800: #0F3D4E;
      --color-petrol-900: #0B2D3C;
      --color-petrol-950: #071E2C;
      --color-areia: #F5F0E8;
      --color-fundo: #F3F5F6; /* petróleo a 5% sobre branco: neutro frio da paleta */
      --color-neutral-925: #111111;
      --font-sans: 'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, sans-serif;
      --font-display: 'Atkinson Hyperlegible Next', ui-sans-serif, sans-serif;
    }

    .cartao { @apply bg-white dark:bg-neutral-950 rounded-xl border border-slate-200/80 dark:border-neutral-800 shadow-[0_1px_2px_rgb(7_30_44/0.05)] dark:shadow-none; }
    .titulo-secao { @apply font-display font-semibold text-slate-900 dark:text-neutral-100; }
    .rotulo { @apply text-xs font-medium text-slate-500 dark:text-neutral-400; }
    .campo { @apply rounded-lg border border-slate-300 dark:border-neutral-700 bg-white dark:bg-neutral-950 px-3 py-1.5 text-sm text-slate-700 dark:text-neutral-200 focus:outline-none focus:border-petrol-800 dark:focus:border-sky-400 focus:ring-2 focus:ring-petrol-800/20; }
    .link { @apply text-sm font-medium text-petrol-800 dark:text-sky-300 hover:underline; }
    .surgir { animation: surgir 0.35s ease both; }
    @keyframes surgir { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .surgir { animation: none; } }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="icon" type="image/svg+xml" href="../img/aulor-favicon.svg">
</head>
<body class="h-full bg-fundo dark:bg-black font-sans text-slate-800 dark:text-neutral-100 antialiased">
  <div class="flex h-screen overflow-hidden">

    <!-- Sidebar: shell comum dos portais; os itens em js/menu.js, o desenho em ../js/menu-portal.js. -->
    <aside data-sidebar class="shell shell-lateral">
      <div class="shell-marca">
        <img src="../img/aulor-simbolo.svg" alt="" class="shell-simbolo">
        <div>
          <img src="../img/aulor-wordmark-claro.svg" alt="Aulor" class="shell-wordmark">
        </div>
      </div>
      <nav class="shell-nav" aria-label="Menu principal"></nav>
    </aside>

    <!-- Área principal -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <header class="shell shell-topo">
        <div class="shell-contexto">
          <button type="button" data-toggle-sidebar title="Ocultar menu" class="shell-icone">
            <svg aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
          </button>
          <h1 class="shell-titulo">Estudos</h1>
        </div>
        <div class="shell-acoes">
          <button type="button" data-toggle-tema title="Tema escuro" class="shell-icone">
            <svg class="shell-tema-lua" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" /></svg>
            <svg class="shell-tema-sol" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" /></svg>
          </button>
          <span class="shell-usuario"></span>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto p-6 space-y-6">
        <h2 class="font-display text-xl font-semibold text-slate-900 dark:text-neutral-100 surgir">Calendário</h2>

        <!-- Barra: navegação de mês + filtros -->
        <div class="cartao px-4 py-3 flex flex-wrap items-center gap-3 surgir">
          <div class="flex items-center gap-1">
            <button type="button" id="mes-anterior" title="Mês anterior" class="p-2 rounded-lg text-slate-500 hover:text-petrol-800 dark:hover:text-sky-300 hover:bg-slate-100 dark:hover:bg-neutral-900 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-petrol-800/40">
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" /></svg>
            </button>
            <h2 id="titulo-mes" class="font-display font-semibold text-lg text-slate-900 dark:text-neutral-100 w-44 text-center capitalize tabular-nums"></h2>
            <button type="button" id="mes-seguinte" title="Mês seguinte" class="p-2 rounded-lg text-slate-500 hover:text-petrol-800 dark:hover:text-sky-300 hover:bg-slate-100 dark:hover:bg-neutral-900 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-petrol-800/40">
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" /></svg>
            </button>
            <button type="button" id="hoje" class="ml-1 rounded-lg border border-slate-300 dark:border-neutral-700 px-3 py-1.5 text-sm font-medium text-slate-700 dark:text-neutral-200 hover:bg-slate-100 dark:hover:bg-neutral-900 transition">Hoje</button>
          </div>
          <div class="ml-auto flex flex-wrap items-center gap-2">
            <label class="sr-only" for="filtro-tipo">Mostrar</label>
            <select id="filtro-tipo" class="campo w-auto">
              <option value="tudo">Tudo</option>
              <option value="aulas">Só aulas</option>
              <option value="eventos">Só eventos</option>
            </select>
            <label class="sr-only" for="filtro-turma">Turma</label>
            <select id="filtro-turma" class="campo w-auto max-w-xs">
              <option value="">Todas as turmas</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_20rem] gap-6 surgir" style="animation-delay: 60ms">
          <!-- Grade mensal -->
          <section class="cartao overflow-hidden min-w-0">
            <div id="cabecalho-dias" class="grid grid-cols-7 border-b border-slate-200 dark:border-neutral-800 text-center text-xs font-medium text-slate-500 dark:text-neutral-400"></div>
            <div id="grade" class="grid grid-cols-7"></div>
            <div id="legenda" class="px-4 py-2.5 border-t border-slate-200 dark:border-neutral-800 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-500 dark:text-neutral-400"></div>
          </section>

          <!-- Próximos eventos -->
          <section class="min-w-0">
            <h2 class="titulo-secao mb-3">Próximos eventos</h2>
            <div id="proximos" class="cartao divide-y divide-slate-100 dark:divide-neutral-900"></div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 items-end pointer-events-none" role="status" aria-live="polite"></div>

  <script src="../js/agenda.js"></script>
  <script src="../js/cursos-data.js"></script>
  <script src="../js/cursos-motor.js"></script>
  <script src="../js/salas-data.js"></script>
  <script src="../js/salas-motor.js"></script>
  <script src="../js/formacoes-data.js"></script>
  <script src="../js/formacoes-motor.js"></script>
  <script src="../js/clientes-data.js"></script>
  <script src="../js/clientes-motor.js"></script>
  <script src="../js/contratos-data.js"></script>
  <script src="../js/contratos-motor.js"></script>
  <script src="../js/feriados-data.js"></script>
  <script src="../js/feriados-motor.js"></script>
  <script src="../js/aulas-motor.js"></script>
  <script src="../js/turmas-motor.js"></script>
  <script src="../js/instrutores-data.js"></script>
  <script src="../js/instrutores-motor.js"></script>
  <script src="../js/eventos-data.js"></script>
  <script src="../js/eventos-motor.js"></script>
  <script src="js/portal-aluno-motor.js"></script>
  <script src="js/calendario-app.js"></script>
</body>
</html>
