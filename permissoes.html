<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Aulor · Perfis de acesso</title>
  <!-- URL antiga: a tela foi separada em perfis.html (lista) e perfil.html?id= (detalhe). -->
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var id = p.get('perfil') || p.get('id');
      location.replace(id ? 'perfil.html?id=' + encodeURIComponent(id) : 'perfis.html');
    })();
  </script>
</head>
<body></body>
</html>
